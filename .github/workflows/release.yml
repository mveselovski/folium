name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Check package.json version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag

  linux-binaries:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binary
        run: scripts/build-standalone.sh

      - name: Smoke test
        run: |
          DIR="$(mktemp -d)"
          tar -xzf dist/folium-*-linux-${{ matrix.arch }}.tar.gz -C "$DIR"
          printf '# Привіт\n\n<img src=x onerror="alert(1)">\n' > "$DIR/test.md"
          printf '<p>hi</p>' > "$DIR/test.html"
          printf 'a\tb\n1\t2,5\n' > "$DIR/test.tsv"
          printf '<?xml version="1.0" encoding="windows-1251"?><FictionBook xmlns="http://www.gribuser.ru/xml/fictionbook/2.0"><description><title-info><book-title>Книга</book-title></title-info></description><body><section><p>Текст</p></section></body></FictionBook>' \
            | iconv -f utf-8 -t windows-1251 > "$DIR/book.fb2"
          (cd "$DIR" && zip -q book.fbz book.fb2)
          "$DIR"/folium-*/folium "$DIR" --port 4000 &
          sleep 2
          R="http://127.0.0.1:4000/api/render?path="
          curl -fsS "${R}test.md" | grep -q 'Привіт'
          if curl -fsS "${R}test.md" | grep -q 'onerror'; then echo "markdown not sanitized"; exit 1; fi
          curl -fsSI "http://127.0.0.1:4000/api/raw?path=test.html" | grep -qi 'content-security-policy: sandbox'
          curl -fsS "${R}test.tsv" | grep -q '>2,5<'
          curl -fsS "${R}book.fb2" | grep -q 'Книга'
          curl -fsS "${R}book.fbz" | grep -q 'Текст'
          kill %1

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/folium-*-linux-${{ matrix.arch }}.tar.gz*
