<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="{{ '/' | relative_url }}">folium</a>
    <nav>
      <a href="{{ '/install/' | relative_url }}"{% if page.url == '/install/' %} aria-current="page"{% endif %}>Install</a>
      <a href="{{ '/usage/' | relative_url }}"{% if page.url == '/usage/' %} aria-current="page"{% endif %}>Usage</a>
      <a href="{{ '/faq/' | relative_url }}"{% if page.url == '/faq/' %} aria-current="page"{% endif %}>FAQ</a>
      <a href="{{ site.repo }}">GitHub</a>
    </nav>
  </div>
</header>
<main class="container{% if page.layout_class %} {{ page.layout_class }}{% else %} prose{% endif %}">
{{ content }}
</main>
<footer class="site-footer">
  <div class="container">
    Folium is free and open source under the <a href="{{ site.repo }}/blob/main/LICENSE">MIT license</a> · <a href="{{ site.repo }}">Source on GitHub</a>
  </div>
</footer>
</body>
</html>
